name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: bun test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test
